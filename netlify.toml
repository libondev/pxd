[build]
base = "./"
publish = "./packages/docs/dist"
command = "pnpm -w run build:only"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/DESIGN.md"
to = "/DESIGN.md"
status = 200
force = true

[[redirects]]
from = "/DESIGN.html"
to = "/DESIGN.html"
status = 200
force = true

[[redirects]]
from = "/agent-install.md"
to = "/agent-install.md"
status = 200
force = true

# vite-ssg writes one flat `*.html` per route, so `/guide/introduction` needs the
# extension appended before the catch-all below gets a chance to answer.
[[redirects]]
from = "/guide/:slug"
to = "/guide/:slug.html"
status = 200

[[redirects]]
from = "/components/:slug"
to = "/components/:slug.html"
status = 200

[[redirects]]
from = "/composables/:slug"
to = "/composables/:slug.html"
status = 200

# The markdown sources an agent reads instead of the rendered page live at the same path.
[[redirects]]
from = "/guide/:slug.md"
to = "/guide/:slug.md"
status = 200
force = true

[[redirects]]
from = "/components/:slug.md"
to = "/components/:slug.md"
status = 200
force = true

[[redirects]]
from = "/composables/:slug.md"
to = "/composables/:slug.md"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/llm.txt"
to = "/llms.txt"
status = 301
force = true
