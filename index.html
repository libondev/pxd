<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="outer" style="background-color: red; touch-action: none;">
    <div id="inner" style="height: 100px; overflow: auto; background-color: blue;">
      <div style="height: 1000px;"></div>
    </div>
  </div>

  <script>
  const outer = document.querySelector('#outer');

  let isPointerDown = false;
  let startY = 0;
  // 用于存储在 pointerdown 时动态找到的可滚动父元素
  let scrollableAncestor = null;

  /**
   * 检查一个元素是否可以垂直滚动
   * @param {HTMLElement} element
   * @returns {boolean}
   */
  const isVerticallyScrollable = (element) => {
    // 必须是 HTMLElement 且具有 scrollHeight 和 clientHeight
    if (!(element instanceof HTMLElement)) return false;
    const style = window.getComputedStyle(element);
    return (
      element.scrollHeight > element.clientHeight &&
      (style.overflowY === 'auto' || style.overflowY === 'scroll')
    );
  };

  /**
   * 从目标元素向上查找，直到容器元素，看是否存在可滚动的祖先
   * @param {HTMLElement} target
   * @param {HTMLElement} container
   * @returns {HTMLElement | null}
   */
  const findScrollableAncestor = (target, container) => {
    let current = target;
    while (current && current !== container) {
      if (isVerticallyScrollable(current)) {
        return current;
      }
      current = current.parentElement;
    }
    // 最后也检查一下容器自身（虽然在本例中不需要，但更通用）
    if (isVerticallyScrollable(container)) {
      return container;
    }
    return null;
  };

  const handlePointerMove = (e) => {
    if (!isPointerDown) return;

    // 如果没有找到可滚动的祖先，则直接处理外层滑动
    if (!scrollableAncestor) {
      console.log('外层 pointermove 触发 (无内部滚动区)');
      // 在这里添加您的外部滑动动画逻辑
      return;
    }

    // --- 以下为找到了可滚动祖先的逻辑 ---
    const atTop = scrollableAncestor.scrollTop === 0;
    // 使用 Math.ceil 来处理像素非整数问题
    const atBottom = Math.ceil(scrollableAncestor.scrollTop + scrollableAncestor.clientHeight) >= scrollableAncestor.scrollHeight;

    // 光标向下移动，意图是向上滚动内容
    const isTryingToScrollUp = e.clientY > startY;
    // 光标向上移动，意图是向下滚动内容
    const isTryingToScrollDown = e.clientY < startY;

    if (atTop && isTryingToScrollUp) {
      console.log('外层 pointermove 触发 (内部已到顶, 且继续向下滑动)');
      e.preventDefault();
      // 在这里添加您的外部滑动动画逻辑
    } else if (atBottom && isTryingToScrollDown) {
      console.log('外层 pointermove 触发 (内部已到底, 且继续向上滑动)');
      e.preventDefault();
      // 在这里添加您的外部滑动动画逻辑
    }
  };

  const handlePointerUp = () => {
    isPointerDown = false;
    scrollableAncestor = null;
    document.removeEventListener('pointermove', handlePointerMove);
    document.removeEventListener('pointerup', handlePointerUp);
  };

  outer.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;

    isPointerDown = true;
    startY = e.clientY;

    // 核心：动态查找可滚动的父元素
    scrollableAncestor = findScrollableAncestor(e.target, outer);

    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);
  });
  </script>
</body>
</html>
