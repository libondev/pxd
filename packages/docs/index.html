<!doctype html>
<html lang="en" class="h-full overflow-y-scroll scrollbar-gutter-stable overscroll-none antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="icon"
      href="/favicon-light.ico"
      type="image/x-icon"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.ico"
      type="image/x-icon"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="PXD - A universal UI component library for Vue 2.7+ & Vue 3.2+. Built-in light/dark theme, PC & mobile ready, animation-free mode supported. Inspired by Geist Design System."
    />
    <meta
      name="keywords"
      content="PXD,Vue component library,Vue2,Vue3,UI components,frontend framework,Geist,TypeScript,Composition API,tree-shaking,dark mode,light mode,theme,responsive,mobile,PC,animation,universal Vue library"
    />
    <meta name="author" content="libondev" />
    <meta name="robots" content="index,follow" />
    <meta name="language" content="en,zh-CN" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PXD UI Component Library",
        "description": "A universal UI component library for Vue 2.7+ & Vue 3.2+. Built-in light/dark theme, PC & mobile ready, animation-free mode supported. Inspired by Geist Design System.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "programmingLanguage": ["TypeScript", "Vue.js", "JavaScript"],
        "author": {
          "@type": "Person",
          "name": "libondev"
        },
        "url": "https://pxd-ui.netlify.app",
        "version": "0.0.40",
        "license": "https://opensource.org/licenses/MIT",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Open Graph Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PXD UI Component Library" />
    <meta property="og:url" content="https://pxd-ui.netlify.app" />
    <meta property="og:title" content="PXD - Universal Vue 2.7+ & Vue 3.2+ UI Component Library" />
    <meta
      property="og:description"
      content="A universal UI component library for Vue 2.7+ & Vue 3.2+. Built-in light/dark theme, seamlessly works on PC & mobile, animation-free mode supported, written in TypeScript."
    />
    <!-- <meta property="og:image" content="https://pxd-ui.netlify.app/og-image.png"> -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pxd_ui" />
    <meta name="twitter:creator" content="@libondev" />
    <meta name="twitter:title" content="PXD - Universal Vue 2.7+ & Vue 3.2+ UI Component Library" />
    <meta
      name="twitter:description"
      content="Built-in light/dark theme, PC & mobile ready, animation-free mode supported. One codebase for Vue 2.7+ & Vue 3.2+. Written in TypeScript."
    />
    <!-- <meta name="twitter:image" content="https://pxd-ui.netlify.app/twitter-image.png"> -->

    <!-- Mobile Optimization -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PXD UI" />

    <!-- Performance and Caching Optimization (8 hours) -->
    <meta http-equiv="Cache-Control" content="max-age=28800" />
    <link rel="preconnect" href="https://netlify.app" />
    <link rel="dns-prefetch" href="//github.com" />

    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta

      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,interactive-widget=resizes-content,viewport-fit=cover"
    />

  <body ontouchstart="">
    <div id="app" class="h-full"></div>
